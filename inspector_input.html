<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InspectK | Digital Diagram</title>
    <style>
        :root {
            --primary: #FF9F0A;
            /* Apple-style Orange */
            --bg: #1C1C1E;
            --modal-bg: #2C2C2E;
            --text: #ffffff;
            --border: #3A3A3C;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            /* Prevent scrolling */
            touch-action: none;
            /* Optimize for touch */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Bar */
        .toolbar {
            padding: 15px;
            background: rgba(44, 44, 46, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .title {
            font-size: 17px;
            font-weight: 600;
        }

        .save-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Canvas Area */
        .canvas-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* The Car Diagram Image */
        #carImage {
            max-width: 100%;
            max-height: 100%;
            display: block;
            pointer-events: none;
            /* Let clicks pass through to SVG */
        }

        /* SVG Overlay for Click Zones */
        #svgOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        /* Zones styling */
        .zone {
            fill: transparent;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 2px;
            cursor: pointer;
            transition: fill 0.2s, stroke 0.2s;
        }

        .zone:active {
            fill: rgba(255, 255, 255, 0.1);
        }

        .zone.active {
            fill: transparent !important;
            /* 배경색 제거 */
            /* stroke: #FF3B30; */
            /* 외곽선도 빨간색으로 변경 (필요시) */
            /* stroke-width: 3px; */
        }

        /* Text Labels on Zones */
        .zone-label {
            font-family: 'Arial-black';
            pointer-events: none;
            font-weight: 900;
            fill: #FF3B30;
            /* 빨간색 글씨 */
            text-anchor: middle;
            dominant-baseline: middle;
            font-size: 70px;
            /* 글자 크기 대폭 확대 */
            paint-order: stroke;
            stroke: #000000;
            /* 검은색 테두리 */
            stroke-width: 6px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Selection Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--modal-bg);
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .modal-title {
            margin-bottom: 20px;
            color: #ccc;
            font-size: 14px;
        }

        /* 2x3 Grid */
        .select-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .code-btn {
            background: #3A3A3C;
            border: 1px solid #48484A;
            color: #fff;
            padding: 20px 0;
            font-size: 24px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .code-btn:active {
            transform: scale(0.95);
        }

        .code-btn.selected {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Confirm Button */
        .confirm-btn {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="toolbar">
        <div class="title">검수차량 상태입력 예시</div>
        <button class="save-btn" onclick="copyResult()">입력완료</button>
    </div>

    <!-- Main Workspace -->
    <div class="canvas-container" id="canvasContainer">
        <img id="carImage" src="car-dg-1.png" alt="Car Diagram">
        <!-- Expanded viewBox to fit the new coordinates (max Y ~2000) -->
        <svg id="svgOverlay" viewBox="0 0 1000 2100" preserveAspectRatio="xMidYMid meet">
            <!-- 
                User Provided Coordinates
             -->

            <!-- 1. Left Fender (좌측 휀더) -->
            <rect id="zone_fender_le" x="250" y="71" width="339" height="554" class="zone"
                onclick="openModal('fender_le')" />
            <text id="label_fender_le" x="420" y="348" class="zone-label"></text>

            <!-- 2. Front Door (앞도어) -->
            <rect id="zone_door_fr" x="220" y="679" width="398" height="426" class="zone"
                onclick="openModal('door_fr')" />
            <text id="label_door_fr" x="419" y="892" class="zone-label"></text>

            <!-- 3. Rear Door (뒷도어) -->
            <rect id="zone_door_rr" x="220" y="1117" width="405" height="431" class="zone"
                onclick="openModal('door_rr')" />
            <text id="label_door_rr" x="423" y="1333" class="zone-label"></text>

            <!-- 4. Side Sill (사이드실) -->
            <rect id="zone_side_sill" x="138" y="607" width="58" height="793" class="zone"
                onclick="openModal('side_sill')" />
            <text id="label_side_sill" x="167" y="1004" class="zone-label"></text>

            <!-- 5. A Pillar (A필러) -->
            <rect id="zone_pillar_a" x="618" y="653" width="293" height="388" class="zone"
                onclick="openModal('pillar_a')" />
            <text id="label_pillar_a" x="765" y="847" class="zone-label"></text>

            <!-- 6. B Pillar (B필러) -->
            <rect id="zone_pillar_b" x="628" y="1069" width="280" height="115" class="zone"
                onclick="openModal('pillar_b')" />
            <text id="label_pillar_b" x="768" y="1127" class="zone-label"></text>

            <!-- 7. C Pillar (C필러) -->
            <rect id="zone_pillar_c" x="776" y="1186" width="133" height="352" class="zone"
                onclick="openModal('pillar_c')" />
            <text id="label_pillar_c" x="842" y="1362" class="zone-label"></text>

            <!-- 8. Quarter Panel (쿼터) -->
            <rect id="zone_quarter" x="280" y="1556" width="516" height="421" class="zone"
                onclick="openModal('quarter')" />
            <text id="label_quarter" x="538" y="1767" class="zone-label"></text>

        </svg>
    </div>

    <!-- Status Selection Modal -->
    <div id="statusModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">SELECT DEFECT CODES</div>
            <div class="select-grid">
                <button class="code-btn" onclick="toggleCode('W')">W</button>
                <button class="code-btn" onclick="toggleCode('X')">X</button>
                <button class="code-btn" onclick="toggleCode('U')">U</button>
                <button class="code-btn" onclick="toggleCode('C')">C</button>
                <button class="code-btn" onclick="toggleCode('A')">A</button>
                <button class="code-btn" onclick="toggleCode('T')">T</button>
            </div>
            <button class="confirm-btn" onclick="saveSelection()">CONFIRM</button>
        </div>
    </div>

    <script>
        // Store inspection data: { 'hood': ['W', 'X'], 'roof': [] }
        let inspectionData = {
            'fender_le': [],
            'door_fr': [],
            'door_rr': [],
            'side_sill': [],
            'pillar_a': [],
            'pillar_b': [],
            'pillar_c': [],
            'quarter': []
        };

        let currentZoneId = null;
        let tempSelection = [];

        // 1. Open Modal
        function openModal(zoneId) {
            currentZoneId = zoneId;
            tempSelection = [...inspectionData[zoneId]]; // Load existing data
            renderModalButtons();
            document.getElementById('statusModal').style.display = 'flex';
        }

        // 2. Render Buttons based on tempSelection
        function renderModalButtons() {
            const buttons = document.querySelectorAll('.code-btn');
            buttons.forEach(btn => {
                const code = btn.innerText;
                if (tempSelection.includes(code)) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }

        // 3. Toggle Code (Multi-select / Deselect)
        function toggleCode(code) {
            if (tempSelection.includes(code)) {
                // Deselect: Remove code
                tempSelection = tempSelection.filter(c => c !== code);
            } else {
                // Select: Add code
                tempSelection.push(code);
            }
            renderModalButtons(); // Refresh UI
        }

        // 4. Save & Close
        function saveSelection() {
            if (!currentZoneId) return;

            // Update Main Data
            inspectionData[currentZoneId] = tempSelection;

            // Update UI (Color & Text)
            updateZoneUI(currentZoneId);

            // Close Modal
            document.getElementById('statusModal').style.display = 'none';
            currentZoneId = null;
        }

        // 5. Update SVG UI
        function updateZoneUI(zoneId) {
            const zoneEl = document.getElementById('zone_' + zoneId);
            const labelEl = document.getElementById('label_' + zoneId);
            const codes = inspectionData[zoneId];

            if (codes.length > 0) {
                // Active State
                zoneEl.classList.add('active');
                labelEl.textContent = codes.join(' '); // e.g., "X U"
            } else {
                // Inactive State
                zoneEl.classList.remove('active');
                labelEl.textContent = '';
            }
        }

        // 6. Close Modal (Background Click)
        function closeModal(event) {
            if (event.target.id === 'statusModal') {
                document.getElementById('statusModal').style.display = 'none';
            }
        }

        // 7. Copy Data Feature
        function copyResult() {
            let result = "";
            for (const [zone, codes] of Object.entries(inspectionData)) {
                if (codes.length > 0) {
                    result += `${zone.toUpperCase()}: ${codes.join(', ')}\n`;
                }
            }
            if (result === "") result = "No defects found.";

            navigator.clipboard.writeText(result).then(() => {
                alert("Data Copied!\n\n" + result);
            });
        }
    </script>

</body>

</html>
